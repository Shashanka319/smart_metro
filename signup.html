<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up | MetroPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=geist-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="mp-public-nav">
      <div class="container py-3 d-flex align-items-center justify-content-between">
        <a class="mp-brand" href="index.html"><i data-lucide="train-front" class="icon-lg"></i> MetroPro</a>
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="mp-theme-toggle" data-theme-toggle aria-label="Toggle theme">
            <span data-icon-sun style="display: none"><i data-lucide="sun"></i></span>
            <span data-icon-moon><i data-lucide="moon"></i></span>
          </button>
          <a href="login.html" class="btn mp-btn-outline btn-sm">Log in</a>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container" style="max-width: 440px">
        <div class="mp-card">
          <h1 class="h3 mb-1">Create your account</h1>
          <p class="text-muted small mb-4">Join MetroPro to access the operations dashboard.</p>
          <div id="mp-signup-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>
          <form id="mp-signup-form" novalidate>
            <div class="mb-3">
              <label class="mp-form-label" for="name">Full name</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i data-lucide="user" class="icon-sm"></i></span>
                <input type="text" class="form-control border-start-0" id="name" name="name" required autocomplete="name" />
              </div>
            </div>
            <div class="mb-3">
              <label class="mp-form-label" for="email">Email</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i data-lucide="mail" class="icon-sm"></i></span>
                <input type="email" class="form-control border-start-0" id="email" name="email" required autocomplete="email" />
              </div>
            </div>
            <div class="mb-2">
              <label class="mp-form-label" for="password">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i data-lucide="lock" class="icon-sm"></i></span>
                <input
                  type="password"
                  class="form-control border-start-0"
                  id="password"
                  name="password"
                  required
                  minlength="8"
                  autocomplete="new-password"
                />
              </div>
              <div class="d-flex justify-content-between align-items-center mt-1">
                <small id="mp-pw-label" class="text-muted"></small>
              </div>
              <div class="mp-strength-bar"><div id="mp-pw-fill" class="mp-strength-fill"></div></div>
            </div>
            <button type="submit" class="btn mp-btn-primary w-100 mt-3">Sign up</button>
          </form>
          <p class="text-center text-muted small mt-4 mb-0">
            Already have an account? <a href="login.html">Log in</a>
          </p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script>
      MetroProTheme.init();
      lucide.createIcons();
      if (MetroProAuth.redirectIfAuthed("home.html")) {
      } else {
        var pw = document.getElementById("password");
        var fill = document.getElementById("mp-pw-fill");
        var label = document.getElementById("mp-pw-label");
        pw.addEventListener("input", function () {
          var s = MetroProValidators.passwordStrength(pw.value);
          fill.style.width = s.percent + "%";
          fill.className = "mp-strength-fill " + (s.className || "");
          label.textContent = s.label ? "Strength: " + s.label : "";
        });
        document.getElementById("mp-signup-form").addEventListener("submit", function (e) {
          e.preventDefault();
          var alertEl = document.getElementById("mp-signup-alert");
          alertEl.classList.add("d-none");
          var name = document.getElementById("name").value;
          var email = document.getElementById("email").value;
          var password = document.getElementById("password").value;
          var res = MetroProAuth.signup(name, email, password);
          if (!res.ok) {
            alertEl.textContent = res.message;
            alertEl.classList.remove("d-none");
            return;
          }
          window.location.href = "home.html";
        });
      }
    </script>
  </body>
</html>
