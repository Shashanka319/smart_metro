<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fare Calculator | MetroPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=geist-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="mp-backdrop"></div>
    <div class="mp-app">
      <aside class="mp-sidebar">
        <a class="mp-brand" href="home.html"><i data-lucide="train-front" class="icon-lg"></i> MetroPro</a>
        <ul id="mp-sidebar-nav" class="mp-sidebar-nav"></ul>
        <div class="pt-3 border-top small" style="border-color: var(--color-border) !important">
          <a href="profile.html" class="d-flex align-items-center gap-2 text-decoration-none text-muted">
            <i data-lucide="settings" class="icon-sm"></i> Settings
          </a>
        </div>
      </aside>
      <div class="mp-main">
        <header class="mp-topbar">
          <button type="button" class="mp-sidebar-toggle" data-sidebar-toggle aria-label="Open menu">
            <i data-lucide="menu"></i>
          </button>
          <span class="fw-semibold">Fare Calculator</span>
          <div class="d-flex align-items-center gap-3">
            <span class="text-muted small d-none d-md-inline" id="mp-user-name"></span>
            <button type="button" class="mp-theme-toggle" data-theme-toggle aria-label="Toggle theme">
              <span data-icon-sun style="display: none"><i data-lucide="sun"></i></span>
              <span data-icon-moon><i data-lucide="moon"></i></span>
            </button>
          </div>
        </header>
        <main class="mp-content">
          <div class="mb-4">
            <h1 class="h3 mb-1">Fare Calculator</h1>
            <p class="text-muted mb-0">Demo fare from shortest path along the real station graph — not the official BMRCL slab table.</p>
          </div>
          <div class="row g-4">
            <div class="col-md-6 col-lg-4">
              <div class="mp-card">
                <h2 class="h6 mb-3">Trip</h2>
                <label class="form-label" for="mp-fare-from">From</label>
                <select class="form-select mb-3" id="mp-fare-from"></select>
                <label class="form-label" for="mp-fare-to">To</label>
                <select class="form-select" id="mp-fare-to"></select>
              </div>
            </div>
            <div class="col-md-6 col-lg-8">
              <div class="mp-card mp-card-highlight">
                <h2 class="h6 mb-3">Your fare</h2>
                <div id="mp-fare-result">
                  <p class="text-muted mb-0">Pick two stations for an instant fare quote.</p>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/journey.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/fare-calculator.js"></script>
    <script>
      MetroProTheme.init();
      document.addEventListener("DOMContentLoaded", function () {
        if (!MetroProAuth.requireAuth()) return;
        MetroProJourney.seedIfEmpty();
        MetroProNav.init();
        lucide.createIcons();
      });
    </script>
  </body>
</html>
