<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Card | Smart Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=geist-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="mp-backdrop"></div>
    <div class="mp-app">
      <aside class="mp-sidebar">
        <a class="mp-brand" href="home.html"><i data-lucide="train-front" class="icon-lg"></i> Smart Metro</a>
        <ul id="mp-sidebar-nav" class="mp-sidebar-nav"></ul>
        <div class="pt-3 border-top small" style="border-color: var(--color-border) !important">
          <a href="profile.html" class="d-flex align-items-center gap-2 text-decoration-none text-muted">
            <i data-lucide="settings" class="icon-sm"></i> Settings
          </a>
        </div>
      </aside>
      <div class="mp-main">
        <header class="mp-topbar">
          <button type="button" class="mp-sidebar-toggle" data-sidebar-toggle aria-label="Open menu">
            <i data-lucide="menu"></i>
          </button>
          <span class="fw-semibold">Smart Card</span>
          <div class="d-flex align-items-center gap-3">
            <span class="text-muted small d-none d-md-inline" id="mp-user-name"></span>
            <button type="button" class="mp-theme-toggle" data-theme-toggle aria-label="Toggle theme">
              <span data-icon-sun style="display: none"><i data-lucide="sun"></i></span>
              <span data-icon-moon><i data-lucide="moon"></i></span>
            </button>
          </div>
        </header>
        <main class="mp-content">
          <div class="mb-4">
            <h1 class="h3 mb-1">Digital smart card</h1>
            <p class="text-muted mb-0">Premium card visualization, QR for ticketing, and wallet transactions stored locally.</p>
          </div>
          <div class="row g-4 align-items-start">
            <div class="col-lg-5">
              <div class="mp-smartcard mx-auto position-relative mp-smartcard--shimmer" style="z-index: 1">
                <div class="mp-smartcard-chip"></div>
                <p class="small mb-1 opacity-75">Smart Metro · Digital (demo)</p>
                <h2 class="h4 mb-4 text-white" id="mp-card-name">—</h2>
                <p class="small mb-0 opacity-90">Card ID</p>
                <p class="font-monospace mb-3 text-white" id="mp-card-id">—</p>
                <div class="d-flex justify-content-between align-items-end gap-3 flex-wrap">
                  <div>
                    <p class="small mb-0 opacity-75">Balance</p>
                    <p class="h3 mb-0 text-white" id="mp-card-balance">₹0</p>
                  </div>
                  <div class="mp-qr-wrap" id="mp-card-qr" aria-label="QR code region"></div>
                </div>
              </div>
              <button type="button" class="btn mp-btn-primary mt-3 w-100" id="mp-card-topup">Simulate ₹200 top-up</button>
            </div>
            <div class="col-lg-7">
              <div class="mp-card">
                <h2 class="h6 mb-3">Transaction history</h2>
                <ul class="list-group list-group-flush" id="mp-card-tx-list"></ul>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/journey.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/smartcard.js"></script>
    <script>
      MetroProTheme.init();
      document.addEventListener("DOMContentLoaded", function () {
        if (!MetroProAuth.requireAuth()) return;
        MetroProJourney.seedIfEmpty();
        MetroProNav.init();
        lucide.createIcons();
      });
    </script>
  </body>
</html>
