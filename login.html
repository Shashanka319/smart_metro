<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in | Smart Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=geist-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="mp-public-nav">
      <div class="container py-3 d-flex align-items-center justify-content-between">
        <a class="mp-brand" href="index.html"><i data-lucide="train-front" class="icon-lg"></i> MetroPro</a>
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="mp-theme-toggle" data-theme-toggle aria-label="Toggle theme">
            <span data-icon-sun style="display: none"><i data-lucide="sun"></i></span>
            <span data-icon-moon><i data-lucide="moon"></i></span>
          </button>
          <a href="signup.html" class="btn mp-btn-primary btn-sm">Sign up</a>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container" style="max-width: 420px">
        <div class="mp-card">
          <h1 class="h3 mb-1">Welcome back</h1>
          <p class="text-muted small mb-4">Sign in to open your Smart Metro dashboard.</p>
          <div id="mp-login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>
          <form id="mp-login-form" novalidate>
            <div class="mb-3">
              <label class="mp-form-label" for="email">Email</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i data-lucide="mail" class="icon-sm"></i></span>
                <input type="email" class="form-control border-start-0" id="email" required autocomplete="username" />
              </div>
            </div>
            <div class="mb-3">
              <label class="mp-form-label" for="password">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i data-lucide="lock" class="icon-sm"></i></span>
                <input type="password" class="form-control border-start-0" id="password" required autocomplete="current-password" />
              </div>
            </div>
            <button type="submit" class="btn mp-btn-primary w-100">Log in</button>
          </form>
          <p class="text-center text-muted small mt-4 mb-0">New here? <a href="signup.html">Create an account</a></p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script>
      MetroProTheme.init();
      lucide.createIcons();
      if (MetroProAuth.redirectIfAuthed("home.html")) {
      } else {
        document.getElementById("mp-login-form").addEventListener("submit", function (e) {
          e.preventDefault();
          var alertEl = document.getElementById("mp-login-alert");
          alertEl.classList.add("d-none");
          var email = document.getElementById("email").value;
          var password = document.getElementById("password").value;
          if (!MetroProValidators.isValidEmail(email)) {
            alertEl.textContent = "Please enter a valid email address.";
            alertEl.classList.remove("d-none");
            return;
          }
          var res = MetroProAuth.login(email, password);
          if (!res.ok) {
            alertEl.textContent = res.message;
            alertEl.classList.remove("d-none");
            return;
          }
          window.location.href = "home.html";
        });
      }
    </script>
  </body>
</html>
