<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Status | MetroPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=geist-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="mp-backdrop"></div>
    <div class="mp-app">
      <aside class="mp-sidebar">
        <a class="mp-brand" href="home.html"><i data-lucide="train-front" class="icon-lg"></i> MetroPro</a>
        <ul id="mp-sidebar-nav" class="mp-sidebar-nav"></ul>
        <div class="pt-3 border-top small" style="border-color: var(--color-border) !important">
          <a href="profile.html" class="d-flex align-items-center gap-2 text-decoration-none text-muted">
            <i data-lucide="settings" class="icon-sm"></i> Settings
          </a>
        </div>
      </aside>
      <div class="mp-main">
        <header class="mp-topbar">
          <button type="button" class="mp-sidebar-toggle" data-sidebar-toggle aria-label="Open menu">
            <i data-lucide="menu"></i>
          </button>
          <span class="fw-semibold">Live Status</span>
          <div class="d-flex align-items-center gap-3">
            <span class="text-muted small d-none d-md-inline" id="mp-user-name"></span>
            <button type="button" class="mp-theme-toggle" data-theme-toggle aria-label="Toggle theme">
              <span data-icon-sun style="display: none"><i data-lucide="sun"></i></span>
              <span data-icon-moon><i data-lucide="moon"></i></span>
            </button>
          </div>
        </header>
        <main class="mp-content">
          <div class="mb-4 d-flex flex-wrap justify-content-between align-items-end gap-2">
            <div>
              <h1 class="h3 mb-1">Network pulse</h1>
              <p class="text-muted mb-0">Simulated headways, crowding, and status per station (refreshes every 8 seconds).</p>
            </div>
            <div class="text-end">
              <span class="badge rounded-pill text-bg-success">Live simulation</span>
              <p class="small text-muted mb-0 mt-2" id="mp-status-updated"></p>
            </div>
          </div>
          <div id="mp-live-status-grid" class="row g-3"></div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/journey.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/live-status.js"></script>
    <script>
      MetroProTheme.init();
      document.addEventListener("DOMContentLoaded", function () {
        if (!MetroProAuth.requireAuth()) return;
        MetroProJourney.seedIfEmpty();
        MetroProNav.init();
        lucide.createIcons();
      });
    </script>
  </body>
</html>
